[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichat-terminal"
version = "1.1.0"
description = "OmniChat Terminal: an interactive terminal chat client for multiple AI providers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
omnichat = "cli:main"
omnichat-terminal = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "_version",
  "app",
  "chat",
  "cli",
  "config",
  "database",
  "export",
  "models",
  "registry",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "live: makes a real, potentially billable request to a configured AI provider",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "_version",
  "app",
  "chat",
  "cli",
  "config",
  "database",
  "export",
  "models",
  "providers",
  "registry",
]
